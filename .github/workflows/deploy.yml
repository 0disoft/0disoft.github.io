name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
      PUBLIC_TALLYFIN_ENDPOINT: ${{ vars.PUBLIC_TALLYFIN_ENDPOINT }}
      PUBLIC_AD_PROVIDER: ${{ vars.PUBLIC_AD_PROVIDER }}
      PUBLIC_AD_CLIENT_ID: ${{ vars.PUBLIC_AD_CLIENT_ID }}
      PUBLIC_BLOG_POST_AD_SLOT: ${{ vars.PUBLIC_BLOG_POST_AD_SLOT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Cache article covers
        uses: actions/cache@v5
        with:
          path: |
            static/images/indiehackers/responsive
            .cache/article-covers.json
          key: ${{ runner.os }}-article-covers-${{ hashFiles('bun.lock', 'scripts/article-cover-images.mjs', 'src/lib/article-cover-sources.ts', 'static/images/indiehackers/*', 'src/content/indiehackers/posts/*/meta.json') }}
          restore-keys: |
            ${{ runner.os }}-article-covers-

      - name: Build and index
        run: bun run build:index

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
